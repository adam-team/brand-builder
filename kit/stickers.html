<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стикеры</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: #fff; padding: 40px; display: grid; gap: 46px; width: 1600px; font-family: var(--body); }
  h2 { font: 600 28px var(--mono); color: var(--muted); }
  h2::before { content: '// '; color: var(--accent); }
  .sheet { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .sq { width: 116px; height: 116px; border-radius: calc(var(--r) * 1.1); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 52px var(--mono); }
  .sq.o { background: #fff; color: var(--accent); border: 5px solid var(--accent); }
  .sq.k { background: var(--dark); color: var(--light-alt); }
  .pill { padding: 14px 28px; border-radius: var(--r2); font: 700 38px var(--mono); background: var(--accent); color: var(--on-accent); }
  .pill.o { background: #fff; color: var(--accent); border: 4px solid var(--accent); }
  .pill.k { background: var(--dark); color: var(--light-alt); }
  .pill.k::before { content: '> '; color: var(--accent-dark); }
  .tip { font: var(--dw) 42px var(--display); letter-spacing: var(--track); padding: 10px 24px; background: var(--accent); color: var(--on-accent); border-radius: var(--r2); transform: rotate(-3deg); }
  .die { padding: 18px; border-radius: calc(var(--r) * 1.3); background: #fff; box-shadow: 0 0 0 3px #e9e4dd, 0 18px 30px -18px rgba(0,0,0,.4); display: inline-grid; }
  .die .in { border-radius: var(--r); padding: 28px 36px; display: grid; gap: 10px; justify-items: start; }
  .die .big { font: var(--dw) 54px/1 var(--display); letter-spacing: var(--track); }
  .die .sm { font: 700 20px var(--mono); }
  .bg-a { background: var(--accent); color: var(--on-accent); } .bg-d { background: var(--dark); color: var(--light-alt); } .bg-l { background: var(--light-alt); color: var(--dark); }
  .bg-d .sm { color: var(--accent-dark); } .bg-l .sm { color: var(--accent); }
</style>
</head>
<body>
<script src="brand.js"></script>
<script>
Brand.load().then((B) => {
  const C = B.C, cfg = B.cfg, S = cfg.stickers || {}
  const words = S.story || ['NEW', 'FREE', 'ДА', 'НЕТ', 'OK']
  const tags = S.tags || ['кейс', 'prompt', 'результат', 'важно']
  const print = S.print || [['// status', cfg.name, cfg.tagline || '']]
  const r = C.accent, ln = `fill="none" stroke="${r}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"`
  const svg = (b) => `<svg viewBox="0 0 120 120" width="116" ${ln}>${b}</svg>`
  const ICON = [
    svg('<path d="M20 90C40 40 70 30 98 34M98 34L80 22M98 34L84 52"/>'),
    `<svg viewBox="0 0 120 120" width="116"><path d="M60 100S14 72 14 42a22 22 0 0 1 46-10a22 22 0 0 1 46 10c0 30-46 58-46 58z" fill="${r}"/></svg>`,
    `<svg viewBox="0 0 120 120" width="116"><path d="M60 8l13 37 37 15-37 15-13 37-13-37-37-15 37-15z" fill="${r}"/></svg>`,
    svg('<rect x="22" y="28" width="76" height="50" rx="8"/><path d="M10 92h100"/>'),
    svg('<path d="M60 16a30 30 0 0 0-18 54v12h36V70a30 30 0 0 0-18-54zM46 96h28M50 106h20"/>'),
    svg('<circle cx="60" cy="62" r="42"/><path d="M60 38v26l16 10"/>'),
    B.mark({ fg: r, size: 110 }),
  ]
  const bgs = ['bg-a', 'bg-d', 'bg-l', 'bg-d']
  document.body.innerHTML = `
    <h2>для сторис</h2>
    <div class="sheet">
      ${[1, 2, 3].map((n) => `<span class="sq">${n}</span>`).join('')}${[4, 5].map((n) => `<span class="sq o">${n}</span>`).join('')}
      <span class="sq k">✓</span><span class="sq o">✕</span>
      ${words.map((w, i) => `<span class="pill ${i > 1 ? 'o' : ''}">${w}</span>`).join('')}
      ${tags.map((w) => `<span class="pill k">${w}</span>`).join('')}
      <span class="tip">wow</span><span class="tip" style="background:var(--dark);color:var(--light-alt)">сохрани</span>
      ${ICON.map((x) => `<span>${x}</span>`).join('')}
    </div>
    <h2>для печати: чехол, ноутбук, коробка</h2>
    <div class="sheet">
      ${print.map(([sm, big, sm2], i) => `<div class="die"><div class="in ${bgs[i % 4]}"><span class="sm">${sm}</span><span class="big">${big}</span>${sm2 ? `<span class="sm" style="color:inherit;opacity:.8">${sm2}</span>` : ''}</div></div>`).join('')}
      <div class="die" style="border-radius:50%;padding:12px">${B.badge({ size: 240 })}</div>
      <div class="die"><div class="in bg-l" style="justify-items:center">${B.mark({ fg: r, size: 170 })}</div></div>
    </div>`
  document.body.dataset.ready = '1'
})
</script>
</body>
</html>
