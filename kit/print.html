<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Печать: сертификат, визитка</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { display: grid; gap: 40px; padding: 40px; font-family: var(--body); }
  body.single { padding: 0; gap: 0; background: none; display: block; }
  body.single > section:not(.show) { display: none; }
  /* Сертификат A4 горизонтально, 300 dpi: 3508×2480 слишком тяжело, берём 2480×1754 (≈ 212 dpi) */
  .cert { width: 2480px; height: 1754px; background: var(--light); color: var(--dark); position: relative; overflow: hidden; }
  .cert .side { position: absolute; left: 0; top: 0; bottom: 0; width: 520px; background: var(--dark); color: var(--light-alt); padding: 120px 90px; display: grid; align-content: space-between; }
  .cert .side .mono { font-size: 34px; color: var(--muted); line-height: 1.6; }
  .cert .main { position: absolute; left: 640px; right: 160px; top: 170px; bottom: 170px; display: grid; align-content: center; gap: 46px; }
  .cert .kick { font: 600 40px var(--mono); color: var(--accent); }
  .cert .h { font: var(--dw) 150px/1 var(--display); letter-spacing: var(--track); text-transform: var(--case); }
  .cert .who { font: var(--dw) 110px/1.05 var(--display); letter-spacing: var(--track); color: var(--accent); }
  .cert .t { font: 500 46px/1.5 var(--body); opacity: .8; max-width: 1500px; }
  .cert .foot { display: flex; gap: 120px; align-items: end; margin-top: 30px; }
  .cert .foot div { font: 500 32px var(--mono); color: var(--muted); }
  .cert .foot b { display: block; font: italic 500 72px var(--script); color: var(--dark); border-bottom: 3px solid var(--soft); padding-bottom: 6px; margin-bottom: 10px; }
  .cert .badge { position: absolute; right: 150px; bottom: 140px; }
  /* Визитка 90×50 мм ≈ 1063×591 */
  .card { width: 1063px; height: 591px; position: relative; overflow: hidden; }
  .card.front { background: var(--accent); display: grid; place-items: center; }
  .card.back { background: var(--light); color: var(--dark); padding: 70px 80px; display: grid; align-content: space-between; }
  .card.back .nm { font: var(--dw) 60px var(--display); letter-spacing: var(--track); }
  .card.back .rl { font: 600 26px var(--mono); color: var(--accent); margin-top: 12px; }
  .card.back .ct { font: 500 30px/1.7 var(--mono); opacity: .8; }
  .card.back .mk { position: absolute; right: 80px; top: 70px; }
</style>
</head>
<body>
<script src="brand.js"></script>
<script>
Brand.load().then((B) => {
  const C = B.C, cfg = B.cfg, P = cfg.print || {}
  const pat = (fg) => `<div class="grid-bg" style="background:${B.pattern({ fg, opacity: .12, step: 48 })}"></div>`
  document.body.insertAdjacentHTML('beforeend', `
  <section class="cert" id="cert">${pat(C.dark)}
    <div class="side">${B.mark({ fg: C.light_alt, size: 200 })}<div class="mono">${(P.side || [cfg.tagline || '', cfg.site || '']).filter(Boolean).map((x) => '// ' + x).join('<br>')}</div></div>
    <div class="main">
      <div class="kick">// certificate · № 0001</div>
      <div class="h">${P.cert_title || 'Сертификат'}</div>
      <div class="t">подтверждает, что</div>
      <div class="who">${P.cert_student || 'Имя Фамилия ученика'}</div>
      <div class="t">${P.cert_text || 'успешно прошёл(-ла) курс <b>«Название курса»</b>'}</div>
      <div class="foot"><div><b>${cfg.name}</b>${P.signer_role || 'автор курса'}</div><div><b style="font-family:var(--mono);font-style:normal;font-size:44px">${P.date || '__.__.2026'}</b>дата</div></div>
    </div>
    <div class="badge">${B.badge({ size: 330, bg: 'none' })}</div>
  </section>
  <section class="card front" id="front"><div class="grid-bg" style="background:${B.pattern({ fg: '#FFFFFF', opacity: .2 })}"></div>${B.mark({ fg: C.on_accent, size: 250 })}</section>
  <section class="card back" id="back">${pat(C.dark)}
    <div style="position:relative"><div class="nm">${cfg.name}</div><div class="rl">// ${cfg.tagline || ''}</div></div>
    <div class="ct" style="position:relative">${(P.contacts || ['WhatsApp +7 ___ ___ __ __', cfg.handle || '']).join('<br>')}</div>
    <div class="mk">${B.mark({ fg: C.accent, size: 120 })}</div>
  </section>`)
  const one = new URLSearchParams(location.search).get('s'); if (one) { document.body.classList.add('single'); document.getElementById(one).classList.add('show') }
  document.body.dataset.ready = '1'
})
</script>
</body>
</html>
